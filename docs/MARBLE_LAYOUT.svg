<text x="8" y="440" font-size="11">上が奥（-z）・左が西（-x）。1マス＝2m。座標は demo-world.html の GREAT と同じ</text>
<text x="528" y="26" font-size="15" font-weight="bold">巨木のある聖域：配置案</text>
<g transform="translate(528,52)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">1</text><text x="28" y="4" font-weight="bold">入口の古い石の門</text><text x="28" y="22" font-size="11" fill="#5a4830">かべの絵と同じもよう。足もとに、ほのかに光る花</text></g>
<g transform="translate(528,98)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">2</text><text x="28" y="4" font-weight="bold">巨木への道</text><text x="28" y="22" font-size="11" fill="#5a4830">約25m。ほのかに灯る石・草花・光の粒</text></g>
<g transform="translate(528,144)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">3</text><text x="28" y="4" font-weight="bold">巨木</text><text x="28" y="22" font-size="11" fill="#5a4830">幹の半径 約2.9m・高さ 約20m。洞が光る</text></g>
<g transform="translate(528,190)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">4</text><text x="28" y="4" font-weight="bold">大きな存在（オオネ）</text><text x="28" y="22" font-size="11" fill="#5a4830">根もとで眠る。体の長さ 約4m</text></g>
<g transform="translate(528,236)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">5</text><text x="28" y="4" font-weight="bold">広場</text><text x="28" y="22" font-size="11" fill="#5a4830">半径5m。会話の場所。光の筋が差し込む</text></g>
<g transform="translate(528,282)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">6</text><text x="28" y="4" font-weight="bold">種を植える場所</text><text x="28" y="22" font-size="11" fill="#5a4830">途切れた道のはし</text></g>
<g transform="translate(528,328)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">7</text><text x="28" y="4" font-weight="bold">光のつるの橋</text><text x="28" y="22" font-size="11" fill="#5a4830">川（幅 約2.4m）をまたぐ。約4.6m</text></g>
<g transform="translate(528,374)"><circle cx="10" cy="0" r="10" fill="#fff" stroke="#3a3328"/><text x="10" y="4" text-anchor="middle" font-weight="bold">8</text><text x="28" y="4" font-weight="bold">向こう岸</text><text x="28" y="22" font-size="11" fill="#5a4830">半径3m。南西の空に、次の目印の島</text></g>
